<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BriefBang Reportes</title>
<meta name="description" content="Reportes privados de rendimiento de campañas publicitarias para clientes de BriefBang.">
<style>
  :root { --bg:#fafaf9; --fg:#1c1917; --muted:#57534e; --accent:#1d4ed8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141414; --fg:#f5f5f4; --muted:#a8a29e; --accent:#93b4ff; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:560px; padding:48px 16px; }
  h1 { font-size:1.8rem; margin:0 0 12px; }
  p { color:var(--muted); margin:0 0 16px; }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>BriefBang Reportes</h1>
  <p>Herramienta interna de BriefBang que genera reportes privados de rendimiento de campañas en Google Ads y Meta Ads para nuestros clientes. Los datos se leen en modo lectura, con autorización de cada anunciante, y cada reporte está protegido con contraseña.</p>
  <p><a href="/privacidad">Política de privacidad</a></p>
</main>
</body>
</html>
